spring.application.name=cmiap

# --- Integracao com o Google Gemini (langchain4j) ---
# A chave NUNCA vai para o repositorio: exporte GEMINI_API_KEY no ambiente.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model-name=gemini-2.5-flash
gemini.temperature=0.7
gemini.max-output-tokens=2048
gemini.timeout=60s
gemini.log-requests-and-responses=false
