spring.application.name=cmiap

# Configuração do PostgreSQL
spring.datasource.url=${PG_URL}
spring.datasource.username=${PG_USERNAME}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA e Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configure JWT_SECRET as a Base64-encoded random secret with at least 32 bytes.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=PT10M
app.security.jwt.refresh-token-ttl=P7D

# Set COOKIE_SECURE=false only for local HTTP development; production must use HTTPS.
app.security.cookies.secure=${COOKIE_SECURE}
app.security.cookies.same-site=Lax

# Comma-separated exact frontend origins. Empty by default; no browser origin is allowed until configured.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# One-time administrator bootstrap is disabled unless explicitly enabled for a non-web run.
app.security.bootstrap-admin.enabled=${ADMIN_GEN_VALUE}
app.security.bootstrap-admin.name=${ADMIN_NAME}
app.security.bootstrap-admin.surname=${ADMIN_SURNAME}
app.security.bootstrap-admin.cpf=${ADMIN_CPF}
app.security.bootstrap-admin.email=${ADMIN_EMAIL}
app.security.bootstrap-admin.password=${ADMIN_PASSWORD}

# Gemini API key is supplied by the backend environment, never by the frontend.
langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY}
langchain4j.google-ai-gemini.chat-model.model-name=gemini-3.6-flash
