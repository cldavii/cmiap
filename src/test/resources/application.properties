spring.datasource.url=jdbc:h2:mem:cmiap;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.security.bootstrap-admin.enabled=false
app.security.cookies.secure=false
app.security.cookies.same-site=
app.cors.allowed-origins=http://localhost:5173,https://incorp-front.onrender.com
