spring.application.name=cmiap

# Chave falsa: os testes nunca chamam a API, so montam o bean.
gemini.api-key=chave-de-teste
gemini.model-name=gemini-3.8-flash

# A fabrica HTTP padrao (JDK HttpClient) abre um NIO Selector no momento da construcao.
# Nos testes isso e peso morto -- e em maquinas Windows onde o loopback esta bloqueado
# por Winsock/EDR o Selector nem abre. A fabrica 'simple' nao depende de NIO.
spring.http.clients.imperative.factory=simple
